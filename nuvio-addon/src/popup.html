<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Nuvio Helper</title>
  <style>
    body {
      width: 280px;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 14px;
    }
    h3 { margin: 0 0 10px; color: #4a5beb; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #4a5beb;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #3a49c9; }
  </style>
</head>
<body>
  <h3>Nuvio Helper ⚡</h3>
  <div class="row">
    <label for="enabled">Addon activado</label>
    <input type="checkbox" id="enabled" checked />
  </div>
  <div class="row">
    <label for="quickActions">Mostrar barra rápida</label>
    <input type="checkbox" id="quickActions" checked />
  </div>
  <button id="save">Guardar</button>
  <script src="popup.js"></script>
</body>
</html>
